name: Build ZhihuNoAds

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools (dpkg + ldid)
        run: brew install dpkg ldid

      - name: Ensure Xcode iPhoneOS SDK is available
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer 2>/dev/null || true

      - name: Build dylib (rootless, iOS 14+ / Dopamine / TrollStore / TrollFools)
        run: |
          make
          VER=$(grep '^Version:' layout/DEBIAN/control | awk '{print $2}')
          cp build/ZhihuNoAds.dylib "build/ZhihuNoAds-${VER}.dylib"
          ls -la build/ZhihuNoAds-${VER}.dylib

      - name: Upload dylib (巨魔 / TrollFools 注入用，文件名含版本号)
        uses: actions/upload-artifact@v4
        with:
          name: ZhihuNoAds-dylib
          path: build/ZhihuNoAds-*.dylib
